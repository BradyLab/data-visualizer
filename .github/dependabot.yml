# Weekly dependency update PRs. Minor and patch updates of one ecosystem arrive together in a single PR; major ones stay separate so they
# can be reviewed alone. The R packages are not listed here: they come from the dated package snapshot of the rocker base image
# (see the Dockerfiles in shiny/), so they only change when the base image tag does
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend-express
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/Los_Angeles
    # A new release waits a week before it is proposed, so a compromised one can be caught and pulled first (matters for auto-merge)
    cooldown:
      default-days: 7
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    # @types/node follows the Node version the project runs on (.nvmrc and the compose files), not the newest Node
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    # @types/node follows the Node version the project runs on (.nvmrc and the compose files), not the newest Node
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # The compose files (postgres, node) and the two R images (rocker/shiny and rocker/r-ver, whose tag is the R version)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/Los_Angeles
  # The two R images share one entry and one group so they always move to the same R version in a single PR
  - package-ecosystem: docker
    directories:
      - /shiny
      - /shiny/preprocess
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: America/Los_Angeles
    groups:
      r-images:
        patterns: ["rocker/*"]

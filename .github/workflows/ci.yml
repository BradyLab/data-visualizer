# Runs on every push to main and on pull requests: backend checks, frontend checks, the Docker images for the R services, then the Playwright e2e tests
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-express
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend-express/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The package's lint scripts pass --fix, so run the linters directly to fail instead of rewriting files
      - run: npx oxlint .
      - run: npx eslint . --cache
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run build-only

  # Air is a standalone formatter, so this needs no R; it fails instead of rewriting files, like prettier --check does for the TypeScript
  r-format:
    name: R format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: posit-dev/setup-air@v1
      - run: air format --check shiny

  # The R services have no package manifest: the Dockerfile is the only place their dependencies are declared, so building the
  # images is what catches a missing package (library(x) failing at startup)
  shiny:
    name: Shiny image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the Shiny image
        uses: docker/build-push-action@v7
        with:
          context: shiny
          load: true
          tags: shiny-ci
          cache-from: type=gha,scope=shiny
          cache-to: type=gha,scope=shiny,mode=max
      - name: Check that the app parses
        run: docker run --rm --entrypoint Rscript shiny-ci -e 'invisible(parse("/srv/shiny-server/app/app.R"))'
      # shiny/tests/test-app.R sources app.R and checks its helpers (signed context, tissue map reader, ordering); see shiny/README.md
      - name: Run the R tests of the app
        run: docker run --rm -v "$PWD/shiny:/work:ro" --entrypoint Rscript shiny-ci /work/tests/test-app.R
      # Shiny Server only starts the app on the first request, so a request is what surfaces a failing library() or top-level error
      - name: Check that the app starts
        run: |
          docker run -d --name shiny -p 3838:3838 -e SHINY_DEV=1 -e SHINY_SECRET=ci -e PARQUET_DIR=/tmp shiny-ci
          for i in $(seq 1 30); do curl -fs -o /dev/null localhost:3838/app/ && break; sleep 2; done
          curl -fs "localhost:3838/app/?dataset=00000000-0000-0000-0000-000000000000" -o page.html
          if grep -qi "an error has occurred" page.html; then docker logs shiny; exit 1; fi
          grep -q "shiny" page.html
      - name: Show the container log on failure
        if: failure()
        run: docker logs shiny || true

  preprocess:
    name: Preprocess image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the preprocess image
        uses: docker/build-push-action@v7
        with:
          context: shiny/preprocess
          load: true
          tags: preprocess-ci
          cache-from: type=gha,scope=preprocess
          cache-to: type=gha,scope=preprocess,mode=max
      # Converts small Seurat objects built on the fly and reads the Parquet back (shiny/tests/test-preprocess.R)
      - name: Run the R tests of the preprocess script
        run: docker run --rm -v "$PWD/shiny:/work:ro" --entrypoint Rscript preprocess-ci /work/tests/test-preprocess.R

  e2e:
    name: E2E
    needs: [backend, frontend, shiny, preprocess]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend-express/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend-express
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend
      # pretest:e2e starts the throwaway Postgres and posttest:e2e removes it
      - name: Run e2e tests
        run: npm run test:e2e:fast
        working-directory: frontend
        env:
          CI: "true"
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
